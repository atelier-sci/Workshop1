<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" href="../bootstrap/css/bootstrap.min.css">
    <link rel="stylesheet" href="../styles/style.css">
    <title>Book Consultation - NutriAI</title>
    <style>
        :root {
            --primary: #4A7337;
            --primary-dark: #2d4a23;
            --primary-light: #6b9d4f;
        }

        .navbar-enhanced {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(20px);
            padding: 15px 0;
            box-shadow: 0 2px 20px rgba(0, 0, 0, 0.05);
            position: sticky;
            top: 0;
            z-index: 100;
            border-bottom: 1px solid rgba(74, 115, 55, 0.1);
        }

        .nav-container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 0 5%;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo-modern {
            font-size: 24px;
            font-weight: 800;
            color: var(--primary);
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .consultation-section {
            padding: 80px 5%;
            background: linear-gradient(135deg, rgba(74, 115, 55, 0.05) 0%, rgba(255, 107, 107, 0.05) 100%);
        }

        .container-custom {
            max-width: 1200px;
            margin: 0 auto;
        }

        .section-header {
            text-align: center;
            margin-bottom: 60px;
        }

        .section-header h2 {
            font-size: 44px;
            font-weight: 800;
            margin-bottom: 15px;
            line-height: 1.2;
            color: #1a1a1a;
        }

        .section-header p {
            font-size: 18px;
            color: #666;
            max-width: 600px;
            margin: 0 auto;
        }

        .options-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(350px, 1fr));
            gap: 40px;
            max-width: 1200px;
            margin: 0 auto;
        }

        .option-card {
            background: linear-gradient(135deg, #ffffff 0%, #f8fafb 100%);
            padding: 50px;
            border: 1px solid rgba(74, 115, 55, 0.1);
            border-radius: 16px;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .option-card:hover {
            transform: translateY(-8px);
            box-shadow: 0 20px 50px rgba(74, 115, 55, 0.15);
            border-color: var(--primary);
        }

        .option-icon {
            width: 80px;
            height: 80px;
            background: linear-gradient(135deg, var(--primary), var(--primary-light));
            color: white;
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 40px;
            margin-bottom: 25px;
        }

        .option-card h3 {
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 12px;
            color: #1a1a1a;
        }

        .option-card p {
            font-size: 15px;
            color: #666;
            margin-bottom: 30px;
            line-height: 1.6;
        }

        select {
            width: 100%;
            padding: 12px 16px;
            margin: 20px 0 30px 0;
            border-radius: 10px;
            border: 1px solid rgba(74, 115, 55, 0.2);
            font-size: 15px;
            font-family: 'Montserrat', sans-serif;
            background: white;
        }

        .btn-primary-large {
            padding: 14px 40px;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 50px;
            font-weight: 700;
            font-size: 16px;
            display: inline-block;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            cursor: pointer;
            text-decoration: none;
        }

        .btn-primary-large:hover {
            background: var(--primary-dark);
            transform: translateY(-3px);
            box-shadow: 0 15px 35px rgba(74, 115, 55, 0.3);
        }
    </style>
</head>

<body>

    <!-- Navigation -->
    <nav class="navbar-enhanced">
        <div class="nav-container">
            <a href="HomePage.html" class="logo-modern">
                <i class="bi bi-heart-pulse-fill"></i> NutriAI
            </a>
        </div>
    </nav>

    <!-- Consultation Options Section -->
    <section class="consultation-section">
        <div class="container-custom">
            <div class="section-header">
                <h2>Choose Your Path</h2>
                <p>Select how you want to start your nutrition journey with us</p>
            </div>

            <div class="options-grid">
                <!-- OPTION 1 -->
                <div class="option-card">
                    <div class="option-icon">
                        <i class="bi bi-list-check"></i>
                    </div>
                    <h3>Use Existing Diet Plan</h3>
                    <p>Select from pre-designed plans tailored to your health goals and lifestyle</p>

                    <select>
                        <option disabled selected>Select a plan</option>
                        <option>Weight Loss Plan</option>
                        <option>Muscle Gain Plan</option>
                        <option>Keto Plan</option>
                    </select>

                    <button class="btn-primary-large" onclick="confirmPlan()">Confirm Plan</button>
                </div>

                <!-- OPTION 2 -->
                <div class="option-card">
                    <div class="option-icon">
                        <i class="bi bi-person-heart"></i>
                    </div>
                    <h3>Consult a Nutritionist</h3>
                    <p>Get personalized guidance from certified nutritionists matching your specific needs</p>

                    <button class="btn-primary-large" onclick="goToNutritionist()">Choose Nutritionist</button>
                </div>
            </div>
        </div>
    </section>


<script>
function confirmPlan() {
    alert("Diet plan selected successfully!");
}

function goToNutritionist() {
    window.location.href = "ChooseNutritionist.html";
}
</script>

</body>
</html>
