<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NutriAI Dashboard</title>

<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

<style>
body { background:#f5f7fa; font-family:sans-serif; }

.navbar-custom {
  background:white;
  display:flex;
  justify-content:space-between;
  padding:14px 24px;
  border-bottom:1px solid #ddd;
}

.logo {
  color:#28a745;
  font-weight:600;
  text-decoration:none;
}

.content-area { padding:20px; }

.dashboard-card {
  background:white;
  padding:20px;
  border-radius:12px;
  border:1px solid #ddd;
  margin-bottom:20px;
  transition:0.3s;
}
.dashboard-card:hover {
  transform:translateY(-3px);
  box-shadow:0 8px 20px rgba(0,0,0,0.08);
}

.btn-green {
  background:#28a745;
  color:white;
  border:none;
  padding:10px;
  border-radius:8px;
  text-decoration:none;
  display:inline-block;
}
.btn-green:hover { background:#1e7e34; }

.profile-field {
  background:#f5f7fa;
  padding:10px;
  border-radius:8px;
  margin-bottom:10px;
}

.list-group-item {
  font-size:14px;
}
</style>
</head>

<body>

<!-- Navbar -->
<nav class="navbar-custom">
  <a href="#" class="logo">
    <i class="bi bi-heart-pulse-fill"></i> NutriAI
  </a>
  <div>
    <a href="#" class="btn-green">Home</a>
  </div>
</nav>

<div class="content-area">

  <!-- ROW 1 -->
  <div class="row">

    <!-- PROFILE LEFT -->
    <div class="col-md-6">
      <div class="dashboard-card">
        <h4><i class="bi bi-person"></i> Profile</h4>

        <div class="profile-field">
          <strong>Name:</strong> User
        </div>

        <div class="profile-field">
          <strong>Email:</strong> user@email.com
        </div>

        <div class="profile-field">
          <strong>Health:</strong> Good
        </div>

        <button class="btn-green">Edit Profile</button>
      </div>
    </div>

    <!-- DIET RIGHT -->
    <div class="col-md-6">
      <div class="dashboard-card">
        <h4><i class="bi bi-journal-text"></i> Diet Plans</h4>

        <ul class="list-group">
          <li class="list-group-item">Weight Loss Plan</li>
          <li class="list-group-item">Muscle Gain Plan</li>
          <li class="list-group-item">Balanced Diet Plan</li>
        </ul>

        <button class="btn-green mt-3">Add Plan</button>
      </div>
    </div>

  </div>

  <!-- ROW 2 (BUTTONS) -->
  <div class="row">

    <!-- FOOD AI -->
    <div class="col-md-6">
      <div class="dashboard-card text-center">
        <h4><i class="bi bi-camera"></i> Food Recognition</h4>
        <p>Analyze your meals using AI</p>
        <button class="btn-green w-100">
          <i class="bi bi-cpu"></i> Go to AI
        </button>
      </div>
    </div>

    <!-- CONSULTATION -->
    <div class="col-md-6">
      <div class="dashboard-card text-center">
        <h4><i class="bi bi-calendar-check"></i> Book Consultation</h4>
        <p>Schedule with nutritionist</p>
        <button class="btn-green w-100">
          <i class="bi bi-check-circle"></i> Book Now
        </button>
      </div>
    </div>

  </div>

</div>

</body>
</html>
