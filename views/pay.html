<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
<link rel="stylesheet" href="../bootstrap/css/bootstrap.min.css">
<link rel="stylesheet" href="../styles/style.css">
<title>Payment - NutriAI</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --primary: #4A7337;
    --primary-dark: #2d4a23;
    --primary-light: #6b9d4f;
    --gray-50: #F8FAFC;
    --gray-100: #F1F5F9;
    --gray-200: #E2E8F0;
    --gray-300: #CBD5E1;
    --gray-400: #94A3B8;
    --gray-600: #475569;
    --gray-700: #334155;
    --gray-900: #0F172A;
    --radius: 10px;
    --shadow: 0 4px 24px rgba(74, 115, 55, 0.10);
  }

  body {
    font-family: 'Montserrat', sans-serif;
    background: linear-gradient(135deg, rgba(74, 115, 55, 0.05) 0%, #F8FAFC 60%, rgba(74, 115, 55, 0.08) 100%);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    color: var(--gray-900);
  }

  .navbar-enhanced {
    background: rgba(255, 255, 255, 0.95);
    backdrop-filter: blur(20px);
    padding: 25px 0;
    box-shadow: 0 2px 20px rgba(0, 0, 0, 0.05);
    position: sticky;
    top: 0;
    z-index: 100;
    border-bottom: 1px solid rgba(74, 115, 55, 0.1);
  }

  .nav-container {
    max-width: 1400px;
    margin: 0 auto;
    padding: 0 5%;
    display: flex;
    justify-content: space-between;
    align-items: center;
    width: 100%;
  }

  .logo-modern {
    font-size: 24px;
    font-weight: 800;
    color: var(--primary);
    text-decoration: none;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .nav-links {
    display: flex;
    list-style: none;
    gap: 32px;
    margin: 0;
  }

  .nav-link-animated {
    text-decoration: none;
    color: var(--gray-700);
    font-weight: 500;
    font-size: 0.95rem;
    transition: color 0.3s;
  }

  .nav-link-animated:hover {
    color: var(--primary);
  }

  .auth-links {
    display: flex;
    list-style: none;
    gap: 12px;
    margin: 0;
  }

  .btn-modern {
    padding: 10px 20px;
    border-radius: 8px;
    text-decoration: none;
    font-weight: 600;
    font-size: 0.9rem;
    transition: all 0.3s;
    background-color: var(--primary);
    color: white;
    border: none;
    cursor: pointer;
    display: inline-block;
  }

  .btn-modern:hover {
    background-color: var(--primary-dark);
    transform: translateY(-2px);
    box-shadow: 0 4px 12px rgba(74, 115, 55, 0.3);
    color: white;
  }

  .payment-container {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 40px 24px;
  }

  .card {
    background: linear-gradient(135deg, #ffffff 0%, #f8fafb 100%);
    border: 1px solid rgba(74, 115, 55, 0.1);
    border-radius: 18px;
    box-shadow: var(--shadow);
    width: 100%;
    max-width: 520px;
    padding: 36px 36px 32px;
    animation: fadeUp .4s ease both;
  }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(18px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  /* Header */
  .header {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 28px;
  }
  .header-icon {
    width: 34px; height: 34px;
    background: linear-gradient(135deg, var(--primary), var(--primary-light));
    border-radius: 8px;
    display: flex; align-items: center; justify-content: center;
  }
  .header-icon svg { color: white; }
  .header h1 {
    font-family: 'Montserrat', sans-serif;
    font-size: 1.18rem;
    font-weight: 700;
    color: var(--gray-900);
    letter-spacing: -.01em;
  }

  /* Stepper */
  .stepper {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 0;
    margin-bottom: 32px;
  }
  .step-circle {
    width: 32px; height: 32px;
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: .82rem;
    font-weight: 600;
    transition: background .3s, color .3s;
    z-index: 1;
  }
  .step-circle.active   { background: var(--primary); color: #fff; }
  .step-circle.inactive { background: var(--gray-200); color: var(--gray-400); }
  .step-line {
    flex: 1; max-width: 80px; height: 2px;
    background: var(--gray-200);
    transition: background .3s;
  }
  .step-line.done { background: var(--primary); }

  /* Form Step 1 */
  .step { display: none; animation: fadeStep .35s ease both; }
  .step.active { display: block; }
  @keyframes fadeStep {
    from { opacity: 0; transform: translateX(10px); }
    to   { opacity: 1; transform: translateX(0); }
  }

  .row { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-bottom: 16px; }
  .row.full { grid-template-columns: 1fr; }

  .field label {
    display: block;
    font-size: .78rem;
    font-weight: 500;
    color: var(--gray-600);
    margin-bottom: 5px;
    letter-spacing: .02em;
  }
  .field input,
  .field select,
  .field textarea {
    width: 100%;
    border: 1.5px solid var(--gray-200);
    border-radius: var(--radius);
    padding: 9px 12px;
    font-family: 'Montserrat', sans-serif;
    font-size: .88rem;
    color: var(--gray-900);
    background: var(--gray-50);
    transition: border-color .2s, box-shadow .2s;
    outline: none;
  }
  .field input:focus,
  .field select:focus,
  .field textarea:focus {
    border-color: var(--primary);
    box-shadow: 0 0 0 3px rgba(74, 115, 55, 0.15);
    background: #fff;
  }
  .field textarea { resize: vertical; min-height: 78px; }
  .field select { cursor: pointer; }

  .checkbox-row {
    display: flex; align-items: center; gap: 8px;
    font-size: .87rem; color: var(--gray-700);
    cursor: pointer;
    margin-top: 4px;
  }
  .checkbox-row input[type=checkbox] {
    width: 16px; height: 16px;
    accent-color: var(--primary);
    cursor: pointer;
  }

  /* Buttons */
  .btn {
    width: 100%;
    padding: 12px;
    border-radius: var(--radius);
    font-family: 'Montserrat', sans-serif;
    font-size: .92rem;
    font-weight: 600;
    cursor: pointer;
    border: none;
    transition: background .2s, transform .15s, box-shadow .2s;
    margin-top: 22px;
  }
  .btn:active { transform: scale(0.98); }
  .btn-primary {
    background: linear-gradient(135deg, var(--primary), var(--primary-light));
    color: #fff;
  }
  .btn-primary:hover { box-shadow: 0 8px 16px rgba(74, 115, 55, 0.25); }
  .btn-secondary {
    background: var(--gray-100);
    color: var(--gray-700);
  }
  .btn-secondary:hover { background: var(--gray-200); }

  /* Step 2: Summary */
  .summary-section {
    background: rgba(74, 115, 55, 0.05);
    border: 1px solid rgba(74, 115, 55, 0.1);
    border-radius: 12px;
    padding: 18px;
    margin-bottom: 16px;
  }
  .summary-row {
    display: flex; justify-content: space-between; align-items: center;
    padding: 8px 0; font-size: .9rem;
  }
  .summary-row.total {
    border-top: 1.5px solid rgba(74, 115, 55, 0.2);
    padding-top: 12px;
    margin-top: 12px;
    font-weight: 700;
    color: var(--gray-900);
  }
  .summary-row .label { color: var(--gray-600); }
  .summary-row .value { color: var(--gray-900); font-weight: 600; }

  /* Success */
  #step-success {
    text-align: center;
    padding: 12px 0 8px;
  }
  .success-icon {
    width: 62px; height: 62px; border-radius: 50%;
    background: rgba(74, 115, 55, 0.15);
    display: flex; align-items: center; justify-content: center;
    margin: 0 auto 18px;
  }
  .success-icon svg { color: var(--primary); }
  #step-success h2 { font-family: 'Montserrat', sans-serif; font-size: 1.3rem; font-weight: 700; margin-bottom: 8px; }
  #step-success p { color: var(--gray-600); font-size: .9rem; line-height: 1.6; }
</style>
</head>
<body>
  <!-- Navigation -->
  <nav class="navbar-enhanced">
    <div class="nav-container">
      <a href="/" class="logo-modern">
        <i class="bi bi-heart-pulse-fill"></i> NutriAI
      </a>
      <ul class="auth-links">
        <li><a href="BookConsultaion.html" class="btn-modern">Back</a></li>
      </ul>
    </div>
  </nav>

  <div class="payment-container">
    <div class="card">

      <!-- Header -->
      <div class="header">
        <div class="header-icon">
          <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 15l-5-5 1.41-1.41L10 14.17l7.59-7.59L19 8l-9 9z"/></svg>
        </div>
        <h1>Complete Your Payment</h1>
      </div>

      <!-- Stepper -->
      <div class="stepper">
        <div class="step-circle active" id="circle-1">1</div>
        <div class="step-line" id="line-1"></div>
        <div class="step-circle" id="circle-2">2</div>
        <div class="step-line" id="line-2"></div>
        <div class="step-circle" id="circle-3">3</div>
      </div>

      <!-- Step 1: Payment Form -->
      <div class="step active" id="step-1">
        <div class="row">
          <div class="field">
            <label>First Name</label>
            <input type="text" placeholder="John" required>
          </div>
          <div class="field">
            <label>Last Name</label>
            <input type="text" placeholder="Doe" required>
          </div>
        </div>

        <div class="row full">
          <div class="field">
            <label>Email Address</label>
            <input type="email" placeholder="john@example.com" required>
          </div>
        </div>

        <div class="row full">
          <div class="field">
            <label>Phone Number</label>
            <input type="tel" placeholder="+1 (555) 000-0000" required>
          </div>
        </div>

        <div class="row full">
          <div class="field">
            <label>Card Number</label>
            <input type="text" placeholder="1234 5678 9012 3456" required>
          </div>
        </div>

        <div class="row">
          <div class="field">
            <label>Expiry Date</label>
            <input type="text" placeholder="MM/YY" required>
          </div>
          <div class="field">
            <label>CVV</label>
            <input type="text" placeholder="123" required>
          </div>
        </div>

        <div class="row full">
          <div class="field">
            <label>Billing Zip Code</label>
            <input type="text" placeholder="12345" required>
          </div>
        </div>

        <div class="checkbox-row">
          <input type="checkbox" id="terms" required>
          <label for="terms" style="margin: 0; cursor: pointer;">I agree to the terms and conditions</label>
        </div>

        <button class="btn btn-primary" onclick="goStep2()">Continue to Summary</button>
      </div>

      <!-- Step 2: Summary -->
      <div class="step" id="step-2">
        <div class="summary-section">
          <div class="summary-row">
            <span class="label">Selected Plan:</span>
            <span class="value">Premium Nutrition Plan</span>
          </div>
          <div class="summary-row">
            <span class="label">Duration:</span>
            <span class="value">3 Months</span>
          </div>
          <div class="summary-row total">
            <span class="label">Total Amount:</span>
            <span class="value">DZ 79</span>
          </div>
        </div>

        <div class="checkbox-row">
          <input type="checkbox" id="confirm" required>
          <label for="confirm" style="margin: 0; cursor: pointer;">I confirm the payment details are correct</label>
        </div>

        <button class="btn btn-primary" onclick="completePayment()">Complete Payment</button>
        <button class="btn btn-secondary" onclick="goStep1()">Back</button>
      </div>

      <!-- Step 3: Success -->
      <div class="step" id="step-success">
        <div class="success-icon">
          <svg width="32" height="32" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <path d="M20 6L9 17l-5-5"/></svg>
        </div>
        <h2>Payment Successful!</h2>
        <p>Thank you for your payment. Your consultation booking is confirmed.</p>
        <button class="btn btn-primary" onclick="makeAnotherPayment()">Make Another Payment</button>
        <button class="btn btn-secondary" onclick="goDashboard()">Go to Dashboard</button>
      </div>

    </div>
  </div>

  <script>
    function goStep2() {
      const terms = document.getElementById('terms').checked;
      if (!terms) {
        alert('Please agree to the terms and conditions');
        return;
      }
      document.getElementById('step-1').classList.remove('active');
      document.getElementById('step-2').classList.add('active');
      
      document.getElementById('circle-1').classList.remove('active');
      document.getElementById('circle-2').classList.add('active');
      document.getElementById('line-1').classList.add('done');
    }

    function goStep1() {
      document.getElementById('step-2').classList.remove('active');
      document.getElementById('step-1').classList.add('active');
      
      document.getElementById('circle-2').classList.remove('active');
      document.getElementById('circle-1').classList.add('active');
      document.getElementById('line-1').classList.remove('done');
    }

    function completePayment() {
      const confirm = document.getElementById('confirm').checked;
      if (!confirm) {
        alert('Please confirm the payment details');
        return;
      }
      document.getElementById('step-2').classList.remove('active');
      document.getElementById('step-success').classList.add('active');
      
      document.getElementById('circle-2').classList.remove('active');
      document.getElementById('circle-3').classList.add('active');
      document.getElementById('line-2').classList.add('done');
    }

    function makeAnotherPayment() {
      location.reload();
    }
    function goDashboard() {
  window.location.href = "UserDashboard.html";
}
  </script>
</body>
</html>
