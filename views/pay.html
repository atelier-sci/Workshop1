<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
<link rel="stylesheet" href="../bootstrap/css/bootstrap.min.css">
<link rel="stylesheet" href="../styles/style.css">
<title>Payment - NutriAI</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --primary: #4A7337;
    --primary-dark: #2d4a23;
    --primary-light: #6b9d4f;
    --gray-50: #F8FAFC;
    --gray-100: #F1F5F9;
    --gray-200: #E2E8F0;
    --gray-300: #CBD5E1;
    --gray-400: #94A3B8;
    --gray-600: #475569;
    --gray-700: #334155;
    --gray-900: #0F172A;
    --radius: 10px;
    --shadow: 0 4px 24px rgba(74, 115, 55, 0.10);
  }

  body {
    font-family: 'Montserrat', sans-serif;
    background: linear-gradient(135deg, rgba(74, 115, 55, 0.05) 0%, #F8FAFC 60%, rgba(74, 115, 55, 0.08) 100%);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    color: var(--gray-900);
  }

  .navbar-enhanced {
    background: rgba(255, 255, 255, 0.95);
    backdrop-filter: blur(20px);
    padding: 15px 0;
    box-shadow: 0 2px 20px rgba(0, 0, 0, 0.05);
    position: sticky;
    top: 0;
    z-index: 100;
    border-bottom: 1px solid rgba(74, 115, 55, 0.1);
  }

  .nav-container {
    max-width: 1400px;
    margin: 0 auto;
    padding: 0 5%;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  .logo-modern {
    font-size: 24px;
    font-weight: 800;
    color: var(--primary);
    text-decoration: none;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .card {
    background: linear-gradient(135deg, #ffffff 0%, #f8fafb 100%);
    border: 1px solid rgba(74, 115, 55, 0.1);
    border-radius: 18px;
    box-shadow: var(--shadow);
    width: 100%;
    max-width: 520px;
    padding: 36px 36px 32px;
    animation: fadeUp .4s ease both;
  }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(18px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  /* Header */
  .header {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 28px;
  }
  .header-icon {
    width: 34px; height: 34px;
    background: linear-gradient(135deg, var(--primary), var(--primary-light));
    border-radius: 8px;
    display: flex; align-items: center; justify-content: center;
  }
  .header-icon svg { color: white; }
  .header h1 {
    font-family: 'Montserrat', sans-serif;
    font-size: 1.18rem;
    font-weight: 700;
    color: var(--gray-900);
    letter-spacing: -.01em;
  }

  /* Stepper */
  .stepper {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 0;
    margin-bottom: 32px;
  }
  .step-circle {
    width: 32px; height: 32px;
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: .82rem;
    font-weight: 600;
    transition: background .3s, color .3s;
    z-index: 1;
  }
  .step-circle.active   { background: var(--primary); color: #fff; }
  .step-circle.inactive { background: var(--gray-200); color: var(--gray-400); }
  .step-line {
    flex: 1; max-width: 80px; height: 2px;
    background: var(--gray-200);
    transition: background .3s;
  }
  .step-line.done { background: var(--primary); }

  /* Form Step 1 */
  .step { display: none; animation: fadeStep .35s ease both; }
  .step.active { display: block; }
  @keyframes fadeStep {
    from { opacity: 0; transform: translateX(10px); }
    to   { opacity: 1; transform: translateX(0); }
  }

  .row { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-bottom: 16px; }
  .row.full { grid-template-columns: 1fr; }

  .field label {
    display: block;
    font-size: .78rem;
    font-weight: 500;
    color: var(--gray-600);
    margin-bottom: 5px;
    letter-spacing: .02em;
  }
  .field input,
  .field select,
  .field textarea {
    width: 100%;
    border: 1.5px solid var(--gray-200);
    border-radius: var(--radius);
    padding: 9px 12px;
    font-family: 'Montserrat', sans-serif;
    font-size: .88rem;
    color: var(--gray-900);
    background: var(--gray-50);
    transition: border-color .2s, box-shadow .2s;
    outline: none;
  }
  .field input:focus,
  .field select:focus,
  .field textarea:focus {
    border-color: var(--primary);
    box-shadow: 0 0 0 3px rgba(74, 115, 55, 0.15);
    background: #fff;
  }
  .field textarea { resize: vertical; min-height: 78px; }
  .field select { cursor: pointer; }

  .checkbox-row {
    display: flex; align-items: center; gap: 8px;
    font-size: .87rem; color: var(--gray-700);
    cursor: pointer;
    margin-top: 4px;
  }
  .checkbox-row input[type=checkbox] {
    width: 16px; height: 16px;
    accent-color: var(--primary);
    cursor: pointer;
  }

  /* Buttons */
  .btn {
    width: 100%;
    padding: 12px;
    border-radius: var(--radius);
    font-family: 'Montserrat', sans-serif;
    font-size: .92rem;
    font-weight: 600;
    cursor: pointer;
    border: none;
    transition: background .2s, transform .15s, box-shadow .2s;
    margin-top: 22px;
  }
  .btn-primary {
    background: var(--primary);
    color: #fff;
    box-shadow: 0 2px 12px rgba(74, 115, 55, 0.22);
  }
  .btn-primary:hover { background: var(--primary-dark); transform: translateY(-1px); box-shadow: 0 4px 18px rgba(74, 115, 55, 0.28); }
  .btn-primary:active { transform: translateY(0); }
  .btn-secondary {
    background: var(--gray-100);
    color: var(--gray-700);
    border: 1.5px solid var(--gray-200);
    margin-top: 0;
  }
  .btn-secondary:hover { background: var(--gray-200); }

  /* Step 2 layout */
  .s2-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 22px;
    margin-bottom: 10px;
  }

  .s2-label {
    font-size: .78rem;
    font-weight: 600;
    color: var(--gray-600);
    text-transform: uppercase;
    letter-spacing: .07em;
    margin-bottom: 12px;
  }

  /* Calendar */
  .cal-header {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 10px;
  }
  .cal-month {
    font-size: .93rem; font-weight: 600; color: var(--gray-900);
  }
  .cal-nav {
    background: none; border: none; cursor: pointer;
    padding: 4px 8px; color: var(--gray-400);
    font-size: 1rem; border-radius: 6px;
    transition: background .15s, color .15s;
  }
  .cal-nav:hover { background: var(--gray-100); color: var(--primary); }

  .cal-days { display: grid; grid-template-columns: repeat(7, 1fr); gap: 2px; }
  .cal-day-name {
    text-align: center; font-size: .7rem; font-weight: 600;
    color: var(--gray-400); padding-bottom: 6px;
    letter-spacing: .04em;
  }
  .cal-day {
    text-align: center; padding: 6px 0;
    font-size: .82rem; cursor: pointer;
    border-radius: 7px;
    color: var(--gray-700);
    transition: background .15s, color .15s;
    user-select: none;
  }
  .cal-day:hover:not(.empty):not(.disabled) { background: rgba(74, 115, 55, 0.1); color: var(--primary); }
  .cal-day.today { color: var(--primary); font-weight: 700; }
  .cal-day.selected { background: var(--primary); color: #fff !important; font-weight: 600; border-radius: 7px; }
  .cal-day.disabled { color: var(--gray-300); cursor: default; pointer-events: none; }
  .cal-day.empty { cursor: default; }

  /* Time slots */
  .time-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .time-slot {
    display: flex; align-items: center; gap: 6px;
    padding: 8px 10px;
    border: 1.5px solid var(--gray-200);
    border-radius: 8px;
    font-size: .82rem; color: var(--gray-700);
    cursor: pointer;
    transition: border-color .2s, background .2s, color .2s;
    user-select: none;
  }
  .time-slot svg { color: var(--gray-400); flex-shrink: 0; }
  .time-slot:hover:not(.unavailable) { border-color: var(--primary); color: var(--primary); }
  .time-slot.unavailable { background: var(--gray-100); color: var(--gray-300); cursor: default; border-color: transparent; }
  .time-slot.unavailable svg { color: var(--gray-200); }
  .time-slot.selected { border-color: var(--primary); background: rgba(74, 115, 55, 0.1); color: var(--primary); font-weight: 600; }
  .time-slot.selected svg { color: var(--primary); }

  .s2-btn-row {
    display: grid; grid-template-columns: 1fr 1fr; gap: 12px;
    margin-top: 20px;
  }

  .legend { display: flex; gap: 16px; margin-top: 12px; font-size: .75rem; color: var(--gray-400); }
  .legend-dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; margin-right: 4px; vertical-align: middle; }

  /* Success */
  #step-success {
    text-align: center;
    padding: 12px 0 8px;
  }
  .success-icon {
    width: 62px; height: 62px; border-radius: 50%;
    background: rgba(74, 115, 55, 0.15);
    display: flex; align-items: center; justify-content: center;
    margin: 0 auto 18px;
  }
  .success-icon svg { color: var(--primary); }
  #step-success h2 { font-family: 'Montserrat', sans-serif; font-size: 1.3rem; font-weight: 700; margin-bottom: 8px; }
  #step-success p { color: var(--gray-600); font-size: .9rem; line-height: 1.6; }
</style>
</head>
<body>
<div class="card">

  <!-- Header -->
  <div class="header">
    <div class="header-icon">
      <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
        <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 15l-5-5 1.41-1.41L10 14.17l7.59-7.59L19 8l-9 9z"/>
      </svg>
    </div>
    <h1>Complete Your Payment</h1>
  </div>

  <!-- Stepper -->
  <div class="stepper">
    <div class="step-circle active" id="sc1">1</div>
    <div class="step-line" id="sl1"></div>
    <div class="step-circle inactive" id="sc2">2</div>
  </div>

  <!-- Step 1: Payment Info -->
  <div class="step active" id="step1">
    <div class="row">
      <div class="field"><label>First Name</label><input type="text" placeholder="John"></div>
      <div class="field"><label>Last Name</label><input type="text" placeholder="Doe"></div>
    </div>
    <div class="row full">
      <div class="field"><label>Email</label><input type="email" placeholder="john.doe@email.com"></div>
    </div>
    <div class="row full">
      <div class="field"><label>Phone Number</label><input type="tel" placeholder="+1 555 000 0000"></div>
    </div>
    <div class="row">
      <div class="field"><label>Card Number</label><input type="text" placeholder="1234 5678 9012 3456"></div>
      <div class="field"><label>Expiry Date</label><input type="text" placeholder="MM/YY"></div>
    </div>
    <div class="row">
      <div class="field"><label>CVV</label><input type="text" placeholder="123"></div>
      <div class="field"><label>Billing Zip</label><input type="text" placeholder="12345"></div>
    </div>
    <div class="row full">
      <div class="field">
        <label class="checkbox-row">
          <input type="checkbox"> I agree to the Terms & Conditions
        </label>
      </div>
    </div>
    <button class="btn btn-primary" onclick="goStep2()">Proceed to Confirm →</button>
  </div>

  <!-- Step 2: Review Payment -->
  <div class="step" id="step2">
    <div class="s2-label" style="margin-bottom: 20px; text-align: center; font-size: 1rem; font-weight: 700;">Payment Summary</div>

    <div style="border: 1px solid rgba(74, 115, 55, 0.1); border-radius: 10px; padding: 20px; margin-bottom: 20px; background: rgba(74, 115, 55, 0.02);">
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px;">
        <span style="color: var(--gray-600); font-size: 0.9rem;">Diet Plan / Service</span>
        <span style="font-weight: 600; color: #1a1a1a;">Selected Plan</span>
      </div>
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px;">
        <span style="color: var(--gray-600); font-size: 0.9rem;">Duration</span>
        <span style="font-weight: 600; color: #1a1a1a;">1 Month</span>
      </div>
      <div style="border-top: 1px solid rgba(74, 115, 55, 0.1); padding-top: 12px; margin-top: 12px; display: flex; justify-content: space-between; align-items: center;">
        <span style="color: var(--gray-700); font-weight: 700;">Total Amount</span>
        <span style="font-size: 1.3rem; font-weight: 800; color: var(--primary);">DZ 79</span>
      </div>
    </div>

    <div style="margin-bottom: 20px;">
      <label class="checkbox-row">
        <input type="checkbox" checked> Confirm all details are correct
      </label>
    </div>

    <div class="s2-btn-row">
      <button class="btn btn-secondary" onclick="goStep1()">← Back</button>
      <button class="btn btn-primary" style="margin-top:0" onclick="completePayment()">Complete Payment</button>
    </div>
  </div>

  <!-- Step 3: Success -->
  <div class="step" id="step-success">
    <div class="success-icon">
      <svg width="28" height="28" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
        <polyline points="20 6 9 17 4 12"/>
      </svg>
    </div>
    <h2>Payment Successful!</h2>
    <p>Your payment has been processed successfully.<br>You will receive a confirmation email shortly with your access details.</p>
    <button class="btn btn-primary" style="max-width:220px;margin:24px auto 0;display:block" onclick="reset()">Make Another Payment</button>
  </div>

</div>

<script>
// ---- Navigation ----
function goStep2() {
  document.getElementById('step1').classList.remove('active');
  document.getElementById('step2').classList.add('active');
  document.getElementById('sc1').classList.remove('active'); document.getElementById('sc1').classList.add('inactive');
  document.getElementById('sc2').classList.remove('inactive'); document.getElementById('sc2').classList.add('active');
  document.getElementById('sl1').classList.add('done');
}

function goStep1() {
  document.getElementById('step2').classList.remove('active');
  document.getElementById('step1').classList.add('active');
  document.getElementById('sc2').classList.remove('active'); document.getElementById('sc2').classList.add('inactive');
  document.getElementById('sc1').classList.remove('inactive'); document.getElementById('sc1').classList.add('active');
  document.getElementById('sl1').classList.remove('done');
}

function completePayment() {
  document.getElementById('step2').classList.remove('active');
  document.getElementById('step-success').classList.add('active');
}

function reset() {
  document.getElementById('step-success').classList.remove('active');
  document.getElementById('step1').classList.add('active');
  document.getElementById('sc1').classList.remove('inactive'); document.getElementById('sc1').classList.add('active');
  document.getElementById('sc2').classList.remove('active'); document.getElementById('sc2').classList.add('inactive');
  document.getElementById('sl1').classList.remove('done');
}
</script>
</body>
</html>
