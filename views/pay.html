<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Payment Page</title>

  <!-- Bootstrap Icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f6f9;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      padding-top: 90px;

    }

    .payment-container {
      background: #fff;
      padding: 30px;
      border-radius: 15px;
      width: 400px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.1);
    }

    .payment-container h2 {
      text-align: center;
      margin-bottom: 20px;
    }

    .form-group {
      margin-bottom: px;
    }

    label {
      font-size: 14px;
      display: block;
      margin-bottom: 5px;
    }

    input {
      width: 100%;
      padding: 10px;
      border-radius: 8px;
      border: 1px solid #ccc;
      outline: none;
    }

    input:focus {
      border-color: #28a745;
    }

    .row {
      display: flex;
      gap: 25px;
    }

    .pay-btn {
      width: 100%;
      padding: 12px;
      border: none;
      background: #28a745;
      color: white;
      font-size: 16px;
      border-radius: 10px;
      cursor: pointer;
      transition: 0.3s;
    }

    .pay-btn:hover {
      background: #218838;
    }

    .card-icons {
      text-align: right;
      margin-bottom: 10px;
    }

    .card-icons i {
      font-size: 25px;
      margin-left: 5px;
      color: #555;
    }

    .success-message {
      display: none;
      text-align: center;
      color: green;
      margin-top: 15px;
    }
      /* ===== NAVBAR (GREEN THEME) ===== */
:root {
  --primary: #4A7337;
  --primary-dark: #2d4a23;
  --primary-light: #6b9d4f;
}

.navbar-enhanced {
  position: fixed;
  top: 0;
  width: 100%;
  background: rgba(255,255,255,0.95);
  backdrop-filter: blur(15px);
  padding: 15px 5%;
  display: flex;
  justify-content: center;
  box-shadow: 0 2px 20px rgba(0,0,0,0.05);
  z-index: 1000;
  border-bottom: 1px solid rgba(74,115,55,0.1);
}

.nav-container {
  width: 100%;
  max-width: 1200px;
  display: flex;
  justify-content: space-between;
  align-items: center;
}
 .btn-primary-large {
            padding: 14px 40px;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 50px;
            font-weight: 700;
            font-size: 16px;
            display: inline-block;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            cursor: pointer;
            text-decoration: none;
        }

        .btn-primary-large:hover {
            background: var(--primary-dark);
            transform: translateY(-3px);
            box-shadow: 0 15px 35px rgba(74, 115, 55, 0.3);
        }

.logo-modern {
  font-size: 22px;
  font-weight: bold;
  color: var(--primary);
  display: flex;
  align-items: center;
  gap: 8px;
}

.logo-modern i {
  font-size: 24px;
}

.nav-links {
  display: flex;
  list-style: none;
  gap: 25px;
}

.nav-link-animated {
  position: relative;
  color: #333;
  text-decoration: none;
  font-weight: 500;
}

.nav-link-animated::after {
  content: "";
  position: absolute;
  left: 0;
  bottom: -5px;
  width: 0;
  height: 2px;
  background: var(--primary);
  transition: 0.3s;
}

.nav-link-animated:hover::after,
.nav-link-animated.active::after {
  width: 100%;
}

.auth-links {
  display: flex;
  gap: 10px;
}

.btn-modern {
  background: var(--primary);
  color: white;
  padding: 8px 18px;
  border-radius: 20px;
  text-decoration: none;
  transition: 0.3s;
}

.btn-modern:hover {
  background: var(--primary-dark);
}

.btn-modern-outline {
  border: 2px solid var(--primary);
  color: var(--primary);
  padding: 8px 18px;
  border-radius: 20px;
  text-decoration: none;
  transition: 0.3s;
}

.btn-modern-outline:hover {
  background: var(--primary);
  color: white;
}
  </style>
</head>
<body>
  <!-- NAVBAR -->
<nav class="navbar-enhanced">
        <div class="nav-container">
            <a href="HomePage.html" class="logo-modern">
                <i class="bi bi-heart-pulse-fill"></i> NutriAI
            </a>
            <a href="HomePage.html" class="btn-primary-large" style="text-decoration: none;">
                <i class="bi bi-arrow-left"></i>Log Out
            </a>
        </div>
</nav>


<div class="payment-container">
  <h2>Payment</h2>

  <div class="card-icons">
    <i class="bi bi-credit-card"></i>
    <i class="bi bi-credit-card-2-front"></i>
  </div>

  <form id="paymentForm">
    <div class="form-group">
      <label>Cardholder Name</label>
      <input type="text" required>
    </div>

    <div class="form-group">
      <label>Card Number</label>
      <input type="text" placeholder="1234 5678 9012 3456" required>
    </div>

    <div class="row">
      <div class="form-group">
        <label>Expiry Date</label>
        <input type="text" placeholder="MM/YY" required>
      </div>

      <div class="form-group">
        <label>CVV</label>
        <input type="password" placeholder="123" required>
      </div>
    </div>

    <div class="form-group">
      <label>Amount ($)</label>
      <input type="number" value="20" required>
    </div>

    <button type="submit" class="pay-btn">
      Pay Now <i class="bi bi-lock-fill"></i>
    </button>
  </form>

  <div class="success-message" id="successMessage">
    ✅ Payment Successful!
  </div>
</div>

<script>
  document.getElementById("paymentForm").addEventListener("submit", function(e) {
    e.preventDefault();

    // Fake success simulation
    document.getElementById("successMessage").style.display = "block";
  });
</script>

</body>
</html>
