<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Payment Page</title>

  <!-- Bootstrap Icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f6f9;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    .payment-container {
      background: #fff;
      padding: 30px;
      border-radius: 15px;
      width: 400px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.1);
    }

    .payment-container h2 {
      text-align: center;
      margin-bottom: 20px;
    }

    .form-group {
      margin-bottom: 15px;
    }

    label {
      font-size: 14px;
      display: block;
      margin-bottom: 5px;
    }

    input {
      width: 100%;
      padding: 10px;
      border-radius: 8px;
      border: 1px solid #ccc;
      outline: none;
    }

    input:focus {
      border-color: #28a745;
    }

    .row {
      display: flex;
      gap: 10px;
    }

    .pay-btn {
      width: 100%;
      padding: 12px;
      border: none;
      background: #28a745;
      color: white;
      font-size: 16px;
      border-radius: 10px;
      cursor: pointer;
      transition: 0.3s;
    }

    .pay-btn:hover {
      background: #218838;
    }

    .card-icons {
      text-align: right;
      margin-bottom: 10px;
    }

    .card-icons i {
      font-size: 25px;
      margin-left: 5px;
      color: #555;
    }

    .success-message {
      display: none;
      text-align: center;
      color: green;
      margin-top: 15px;
    }
  </style>
</head>
<body>

<div class="payment-container">
  <h2>Payment</h2>

  <div class="card-icons">
    <i class="bi bi-credit-card"></i>
    <i class="bi bi-credit-card-2-front"></i>
  </div>

  <form id="paymentForm">
    <div class="form-group">
      <label>Cardholder Name</label>
      <input type="text" required>
    </div>

    <div class="form-group">
      <label>Card Number</label>
      <input type="text" placeholder="1234 5678 9012 3456" required>
    </div>

    <div class="row">
      <div class="form-group">
        <label>Expiry Date</label>
        <input type="text" placeholder="MM/YY" required>
      </div>

      <div class="form-group">
        <label>CVV</label>
        <input type="password" placeholder="123" required>
      </div>
    </div>

    <div class="form-group">
      <label>Amount ($)</label>
      <input type="number" value="20" required>
    </div>

    <button type="submit" class="pay-btn">
      Pay Now <i class="bi bi-lock-fill"></i>
    </button>
  </form>

  <div class="success-message" id="successMessage">
    ✅ Payment Successful!
  </div>
</div>

<script>
  document.getElementById("paymentForm").addEventListener("submit", function(e) {
    e.preventDefault();

    // Fake success simulation
    document.getElementById("successMessage").style.display = "block";
  });
</script>

</body>
</html>
