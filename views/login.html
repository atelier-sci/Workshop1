<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - NutriAI</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" href="../styles/style.css">
</head>
<body class="auth-body">
    <!-- Navigation -->
    <nav class="navbar-enhanced">
        <div class="nav-container">
            <a href="/" class="logo-modern">
                <i class="bi bi-heart-pulse-fill"></i> NutriAI
            </a>
            <ul class="auth-links">
                <li><a href="HomePage.html" class="btn-modern-outline">Back to Home</a></li>
            </ul>
        </div>
    </nav>

    <div class="auth-container">
        <div class="auth-background">
            <div class="blob blob-1"></div>
            <div class="blob blob-2"></div>
            <div class="blob blob-3"></div>
        </div>

        <div class="auth-wrapper">
            <!-- Login Form -->
            <div class="auth-card">
                <div class="auth-header">
                    <h2>Welcome Back</h2>
                    <p>Sign in to continue your health journey</p>
                </div>

                <form id="loginForm" class="auth-form">
                    <!-- Email -->
                    <div class="form-group">
                        <label for="email" class="form-label">Email Address</label>
                        <div class="input-wrapper">
                            <i class="bi bi-envelope"></i>
                            <input
                                type="email"
                                class="form-control-modern"
                                id="email"
                                name="email"
                                placeholder="you@example.com"
                                required
                            >
                        </div>
                    </div>

                    <!-- Password -->
                    <div class="form-group">
                        <label for="password" class="form-label">Password</label>
                        <div class="input-wrapper">
                            <i class="bi bi-lock"></i>
                            <input
                                type="password"
                                class="form-control-modern"
                                id="password"
                                name="password"
                                placeholder="••••••••"
                                required
                            >
                        </div>
                    </div>

                    <!-- Remember Me & Forgot Password -->
                    <div class="d-flex justify-content-between align-items-center mb-3">
                        <div class="form-check">
                            <input class="form-check-input" type="checkbox" id="remember">
                            <label class="form-check-label" for="remember">
                                Remember me
                            </label>
                        </div>
                        <a href="#" class="text-decoration-none">Forgot password?</a>
                    </div>

                    <!-- Submit Button -->
                    <button type="submit" class="btn-auth-submit" id="submitBtn">
                        <span id="btnText">Sign In</span>
                        <span id="btnSpinner" class="spinner-border spinner-border-sm d-none ms-2"></span>
                    </button>
                </form>

                <!-- Sign Up Link -->
                <div class="auth-footer">
                    <p class="paragraph">Don't have an account? <a href="signup.html" class="link-bold">Sign up</a></p>
                </div>
            </div>

            <!-- Side Benefits -->
            <div class="auth-benefits">
                <h3>What You'll Get</h3>
                <div class="benefit-item">
                    <div class="benefit-icon"><i class="bi bi-check2-circle"></i></div>
                    <div class="benefit-text">
                        <h4>AI Meal Analyzer</h4>
                        <p>Instant calorie detection</p>
                    </div>
                </div>
                <div class="benefit-item">
                    <div class="benefit-icon"><i class="bi bi-check2-circle"></i></div>
                    <div class="benefit-text">
                        <h4>Expert Guidance</h4>
                        <p>Personal nutrition plan</p>
                    </div>
                </div>
                <div class="benefit-item">
                    <div class="benefit-icon"><i class="bi bi-check2-circle"></i></div>
                    <div class="benefit-text">
                        <h4>Progress Tracking</h4>
                        <p>Monitor your results</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        document.getElementById('loginForm').addEventListener('submit', async function (e) {
            e.preventDefault();

            const btnText = document.getElementById('btnText');
            const btnSpinner = document.getElementById('btnSpinner');
            const submitBtn = document.getElementById('submitBtn');

            btnText.classList.add('d-none');
            btnSpinner.classList.remove('d-none');
            submitBtn.disabled = true;

            try {
                // Simulate API call - replace with actual login endpoint
                const response = await fetch('/api/login', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        email: document.getElementById('email').value,
                        password: document.getElementById('password').value,
                        remember: document.getElementById('remember').checked
                    })
                });

                const data = await response.json();

                if (response.ok) {
                    // Success - redirect to dashboard
                    btnText.textContent = 'Success!';
                    btnText.classList.remove('d-none');
                    btnSpinner.classList.add('d-none');
                    submitBtn.classList.add('btn-success');

                    setTimeout(() => {
                        window.location.href = 'HomePage.html'; // Redirect to main page or dashboard
                    }, 1500);
                } else {
                    // Error handling
                    throw new Error(data.message || 'Login failed');
                }

            } catch (error) {
                console.error('Login error:', error);

                // Reset button state
                btnText.textContent = 'Sign In';
                btnText.classList.remove('d-none');
                btnSpinner.classList.add('d-none');
                submitBtn.disabled = false;
                submitBtn.classList.remove('btn-success');
                submitBtn.classList.add('btn-danger');

                // Show error message
                alert('Login failed: ' + error.message);

                // Reset button after 3 seconds
                setTimeout(() => {
                    submitBtn.classList.remove('btn-danger');
                }, 3000);
            }
        });
    </script>
</body>
</html>
