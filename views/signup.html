<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up | Nutrition Platform</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <!-- Google Fonts (modern) -->
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=Manrope:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../styles/style.css">
    
</head>
<body>
    <nav>
    <a href="/" class="logo">Weight Loss</a>
    <ul class="nav-links">
     
      
    </ul>
    <ul class="auth-links">
     
        <li><a href="HomePage.html">Back to home</a></li>
    
    </ul>
</nav>
    <form action="/signup" method="POST" class="form-singup">
    <!-- Floating orb 2 -->
    <div class="orb-2"></div>

    <div class="register-card">
        <div class="register-header text-center mb-4">
            <h2>Create Account</h2>
            <p>Join our nutrition community and start your journey</p>
        </div>

        <form id="registerForm">
            <!-- Full Name -->
            <div class="mb-3">
                <label for="fullName" class="form-label"></label>
                <div class="input-group">
                    <span class="input-group-text"><i class="bi bi-person"></i></span>
                    <input type="text" class="form-control" id="fullName" name="fullName" placeholder="Full Name" required>
                </div>
            </div>

            <!-- Email -->
            <div class="mb-3">
                <label for="email" class="form-label"></label>
                <div class="input-group">
                    <span class="input-group-text"><i class="bi bi-envelope"></i></span>
                    <input type="email" class="form-control" id="email" name="email" placeholder="you@example.com" required>
                </div>
            </div>

            <!-- Password -->
            <div class="mb-3">
                <label for="password" class="form-label"></label>
                <div class="input-group">
                    <span class="input-group-text"><i class="bi bi-lock"></i></span>
                    <input type="password" class="form-control" id="password" name="password" placeholder="••••••••" required minlength="8">
                </div>
                <div class="text-muted-custom mt-1">At least 8 characters</div>
            </div>

            <!-- Weight, Age, Height in one row (responsive) -->
            <div class="row-custom mb-3">
                <div>
                    <label for="weight" class="form-label">Weight (kg)</label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="bi bi-heart-pulse"></i></span>
                        <input type="number" class="form-control" id="weight" name="weight" placeholder="70" min="20" max="300" step="0.1" required>
                    </div>
                </div>
                <div>
                    <label for="age" class="form-label">Age (years)</label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="bi bi-calendar"></i></span>
                        <input type="number" class="form-control" id="age" name="age" placeholder="30" min="10" max="120" required>
                    </div>
                </div>
                <div>
                    <label for="height" class="form-label">Height (cm)</label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="bi bi-arrow-up"></i></span>
                        <input type="number" class="form-control" id="height" name="height" placeholder="175" min="50" max="250" required>
                    </div>
                </div>
            </div>

            <!-- Submit Button -->
            <button type="submit" class="btn btn-register" id="submitBtn">
                <span id="btnText">Register</span>
                <span id="btnSpinner" class="spinner-border spinner-border-sm d-none" role="status" aria-hidden="true"></span>
            </button>
        </form>

        <div class="footer-links">
            <p>Already have an account? <a href="login.html">Log in</a></p>
        </div>
    </div>
</form>
    <!-- Bootstrap JS (optional for some components) -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Custom JavaScript for form submission -->
    <script>
        document.getElementById('registerForm').addEventListener('submit', async function (e) {
            
            e.preventDefault();

            // Show loading spinner
            const btnText = document.getElementById('btnText');
            const btnSpinner = document.getElementById('btnSpinner');
            const submitBtn = document.getElementById('submitBtn');
            btnText.classList.add('d-none');
            btnSpinner.classList.remove('d-none');
            submitBtn.disabled = true;

            // Collect form data
            const formData = {
                fullName: document.getElementById('fullName').value,
                email: document.getElementById('email').value,
                password: document.getElementById('password').value,
                weight: parseFloat(document.getElementById('weight').value),
                age: parseInt(document.getElementById('age').value),
                height: parseInt(document.getElementById('height').value)
            };

            try {
                const response = await fetch('http://localhost:5000/api/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(formData)
                });
            
                const result = await response.json();

                if (response.ok) {
                    alert('Registration successful! Please log in.');
                    window.location.href = 'login.html';
                } else {
                    alert(result.message || 'Registration failed. Please try again.');
                }
            } catch (error) {
                console.error('Error:', error);
                alert('Network error. Please check your connection.');
            } finally {
                // Hide spinner and enable button
                btnText.classList.remove('d-none');
                btnSpinner.classList.add('d-none');
                submitBtn.disabled = false;
            }
        });
    </script>
   
</body>
</html>
