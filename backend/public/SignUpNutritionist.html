<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - Nutritionist</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" href="../styles/style.css">
    <style>
        /* PDF Upload Area */
        .pdf-upload-area {
            border: 2px dashed rgba(74, 222, 128, 0.4);
            border-radius: 14px;
            padding: 28px 16px;
            text-align: center;
            background: rgba(74, 222, 128, 0.04);
            cursor: pointer;
            transition: all 0.25s ease;
            position: relative;
        }

        .pdf-upload-area:hover,
        .pdf-upload-area.dragover {
            border-color: #4ade80;
            background: rgba(74, 222, 128, 0.1);
        }

        .pdf-upload-area i {
            font-size: 2.4rem;
            color: #4ade80;
            display: block;
            margin-bottom: 10px;
        }

        .pdf-upload-area p {
            margin: 0;
            color: #aaa;
            font-size: 0.88rem;
        }

        .pdf-upload-area p span {
            color: #4ade80;
            font-weight: 600;
        }

        #certificateInput {
            position: absolute;
            inset: 0;
            opacity: 0;
            cursor: pointer;
            width: 100%;
            height: 100%;
        }

        .pdf-file-preview {
            display: none;
            align-items: center;
            gap: 12px;
            padding: 12px 16px;
            background: rgba(74, 222, 128, 0.08);
            border: 2px solid rgba(74, 222, 128, 0.4);
            border-radius: 12px;
            margin-top: 10px;
        }

        .pdf-file-preview.show {
            display: flex;
        }

        .pdf-file-preview .pdf-icon {
            font-size: 1.6rem;
            color: #ef4444;
            flex-shrink: 0;
        }

        .pdf-file-preview .file-info {
            flex: 1;
            min-width: 0;
        }

        .pdf-file-preview .file-name {
            color: #fff;
            font-size: 0.88rem;
            font-weight: 600;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .pdf-file-preview .file-size {
            color: #888;
            font-size: 0.78rem;
        }

        .remove-file {
            background: none;
            border: none;
            color: #888;
            cursor: pointer;
            padding: 4px;
            border-radius: 6px;
            transition: color 0.2s;
            font-size: 1rem;
        }

        .remove-file:hover {
            color: #ef4444;
        }

        /* Notice box */
        .notice-box {
            background: rgba(251, 191, 36, 0.08);
            border: 1px solid rgba(251, 191, 36, 0.3);
            border-radius: 10px;
            padding: 12px 14px;
            display: flex;
            gap: 10px;
            align-items: flex-start;
            margin-bottom: 20px;
        }

        .notice-box i {
            color: #fbbf24;
            font-size: 1rem;
            flex-shrink: 0;
            margin-top: 2px;
        }

        .notice-box p {
            margin: 0;
            color: #d4a833;
            font-size: 0.83rem;
            line-height: 1.5;
        }

        .role-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: rgba(74, 222, 128, 0.12);
            border: 1px solid rgba(74, 222, 128, 0.35);
            color: #4ade80;
            font-size: 0.8rem;
            font-weight: 600;
            padding: 4px 12px;
            border-radius: 20px;
            margin-bottom: 12px;
        }
    </style>
</head>
<body class="auth-body">

    <!-- Navigation -->
    <nav class="navbar-enhanced">
        <div class="nav-container">
            <a href="/" class="logo-modern">
                <i class="bi bi-heart-pulse-fill"></i> NutriAI
            </a>
            <ul class="auth-links">
                <li><a href="HomePage.html" class="btn-modern-outline">Back to Home</a></li>
            </ul>
        </div>
    </nav>

    <div class="auth-container">
        <div class="auth-background">
            <div class="blob blob-1"></div>
            <div class="blob blob-2"></div>
            <div class="blob blob-3"></div>
        </div>

        <div class="auth-wrapper">
            <div class="auth-card">
                <div class="auth-header">
                    <div class="role-badge">
                        <i class="bi bi-clipboard2-heart-fill"></i> Nutritionist
                    </div>
                    <h2>Create Your Account</h2>
                </div>

                <div class="notice-box">
                    <i class="bi bi-info-circle-fill"></i>
                    <p>After creating your account, you will be redirected to pay the registration fee to activate your profile.</p>
                </div>

                <form id="registerForm" class="auth-form">

                    <!-- Full Name -->
                    <div class="form-group">
                        <label for="fullName" class="form-label">Full Name</label>
                        <div class="input-wrapper">
                            <i class="bi bi-person"></i>
                            <input type="text" class="form-control-modern" id="fullName" name="fullName" placeholder="Your Full Name" required>
                        </div>
                    </div>

                    <!-- Email -->
                    <div class="form-group">
                        <label for="email" class="form-label">Email Address</label>
                        <div class="input-wrapper">
                            <i class="bi bi-envelope"></i>
                            <input type="email" class="form-control-modern" id="email" name="email" placeholder="you@example.com" required>
                        </div>
                    </div>

                    <!-- Password -->
                    <div class="form-group">
                        <label for="password" class="form-label">Password</label>
                        <div class="input-wrapper">
                            <i class="bi bi-lock"></i>
                            <input type="password" class="form-control-modern" id="password" name="password" placeholder="••••••••" required minlength="8">
                        </div>
                        <small class="form-hint">At least 8 characters</small>
                    </div>

                    <!-- Specialization -->
                    <div class="form-group">
                        <label for="specialization" class="form-label">Specialization</label>
                        <div class="input-wrapper">
                            <i class="bi bi-award"></i>
                            <input type="text" class="form-control-modern" id="specialization" name="specialization" placeholder="e.g. Sports Nutrition, Clinical Dietetics..." required>
                        </div>
                    </div>

                    <!-- Years of Experience -->
                    <div class="form-group">
                        <label for="experience" class="form-label">Years of Experience</label>
                        <div class="input-wrapper">
                            <i class="bi bi-briefcase"></i>
                            <input type="number" class="form-control-modern" id="experience" name="experience" placeholder="e.g. 5" min="0" max="50" required>
                        </div>
                    </div>

                    <!-- Certificate Upload -->
                    <div class="form-group">
                        <label class="form-label">Professional Certificate <span style="color:#4ade80">*</span></label>

                        <div class="pdf-upload-area" id="uploadArea">
                            <input type="file" id="certificateInput" name="certificate" accept=".pdf" required>
                            <i class="bi bi-file-earmark-pdf"></i>
                            <p><span>Click to upload</span> or drag & drop</p>
                            <p style="margin-top: 5px; font-size: 0.78rem;">PDF only · Max 5 MB</p>
                        </div>

                        <div class="pdf-file-preview" id="filePreview">
                            <i class="bi bi-file-earmark-pdf-fill pdf-icon"></i>
                            <div class="file-info">
                                <div class="file-name" id="fileName">certificate.pdf</div>
                                <div class="file-size" id="fileSize"></div>
                            </div>
                            <button type="button" class="remove-file" id="removeFile" title="Remove file">
                                <i class="bi bi-x-lg"></i>
                            </button>
                        </div>
                    </div>

                    <!-- Submit -->
                    <button type="submit" class="btn-auth-submit" id="submitBtn">
                        <span id="btnText">Create Account</span>
                        <span id="btnSpinner" class="spinner-border spinner-border-sm d-none ms-2"></span>
                    </button>
                </form>

                <div class="auth-footer">
                    <p class="paragraph">Already have an account? <a href="login.html" class="link-bold">Log in</a></p>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // ── PDF Upload ───────────────────────────────────────────────
        const certificateInput = document.getElementById('certificateInput');
        const uploadArea       = document.getElementById('uploadArea');
        const filePreview      = document.getElementById('filePreview');
        const fileNameEl       = document.getElementById('fileName');
        const fileSizeEl       = document.getElementById('fileSize');
        const removeFileBtn    = document.getElementById('removeFile');

        function formatBytes(bytes) {
            if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + ' KB';
            return (bytes / (1024 * 1024)).toFixed(2) + ' MB';
        }

        function showFilePreview(file) {
            fileNameEl.textContent = file.name;
            fileSizeEl.textContent = formatBytes(file.size);
            filePreview.classList.add('show');
            uploadArea.style.display = 'none';
        }

        function clearFile() {
            certificateInput.value = '';
            filePreview.classList.remove('show');
            uploadArea.style.display = 'block';
        }

        certificateInput.addEventListener('change', function () {
            if (!this.files || !this.files[0]) return;
            const file = this.files[0];
            if (file.type !== 'application/pdf') {
                alert('Please upload a PDF file only.');
                this.value = '';
                return;
            }
            if (file.size > 5 * 1024 * 1024) {
                alert('File size must be less than 5 MB.');
                this.value = '';
                return;
            }
            showFilePreview(file);
        });

        removeFileBtn.addEventListener('click', clearFile);

        // Drag & Drop
        uploadArea.addEventListener('dragover',  (e) => { e.preventDefault(); uploadArea.classList.add('dragover'); });
        uploadArea.addEventListener('dragleave', ()  => uploadArea.classList.remove('dragover'));
        uploadArea.addEventListener('drop', (e) => {
            e.preventDefault();
            uploadArea.classList.remove('dragover');
            const file = e.dataTransfer.files[0];
            if (!file) return;
            if (file.type !== 'application/pdf') { alert('Please upload a PDF file only.'); return; }
            if (file.size > 5 * 1024 * 1024)     { alert('File size must be less than 5 MB.'); return; }
            const dt = new DataTransfer();
            dt.items.add(file);
            certificateInput.files = dt.files;
            showFilePreview(file);
        });

        // ── Form Submit ──────────────────────────────────────────────
        document.getElementById('registerForm').addEventListener('submit', function (e) {
            e.preventDefault();

            if (!certificateInput.files.length) {
                alert('Please upload your professional certificate (PDF).');
                return;
            }

            // Save email for the payment page
            sessionStorage.setItem('pendingNutritionistEmail', document.getElementById('email').value);

            // Send registration to backend in the background
            const formData = new FormData();
            formData.append('fullName',       document.getElementById('fullName').value);
            formData.append('email',          document.getElementById('email').value);
            formData.append('password',       document.getElementById('password').value);
            formData.append('role',           'nutritionist');
            formData.append('specialization', document.getElementById('specialization').value);
            formData.append('experience',     document.getElementById('experience').value);
            formData.append('certificate',    certificateInput.files[0]);

            fetch('http://localhost:5000/api/register', {
                method: 'POST',
                body: formData
            }).then(r => r.json()).then(result => {
                if (result.userId) sessionStorage.setItem('pendingNutritionistId', result.userId);
            }).catch(err => console.error('Registration error:', err));

            // Redirect immediately to payment page
            window.location.href = 'payNutrionist.html';
        });
    </script>
</body>
</html>
