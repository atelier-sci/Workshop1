<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" href="../bootstrap/css/bootstrap.min.css">
    <link rel="stylesheet" href="/styles/style.css">
    <title>Choose Your Nutritionist - NutriAI</title>
    <style>
        :root {
            --primary: #4A7337;
            --primary-dark: #2d4a23;
            --primary-light: #6b9d4f;
        }

        .page-container {
            min-height: 100vh;
            background: linear-gradient(135deg, rgba(74, 115, 55, 0.05) 0%, rgba(255, 255, 255, 100%) 100%);
        }

        .navbar-enhanced {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(20px);
            padding: 15px 0;
            box-shadow: 0 2px 20px rgba(0, 0, 0, 0.05);
            position: sticky;
            top: 0;
            z-index: 100;
            border-bottom: 1px solid rgba(74, 115, 55, 0.1);
        }

        .nav-container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 0 5%;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo-modern {
            font-size: 24px;
            font-weight: 800;
            color: var(--primary);
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .nutritionist-section {
            padding: 60px 5%;
            max-width: 1200px;
            margin: 0 auto;
        }

        .section-header {
            text-align: center;
            margin-bottom: 50px;
        }

        .section-header h2 {
            font-size: 42px;
            font-weight: 800;
            margin-bottom: 15px;
            color: #1a1a1a;
        }

        .section-header p {
            font-size: 16px;
            color: #666;
            margin: 0;
        }

        .nutritionist-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            gap: 30px;
            margin-bottom: 40px;
        }

        .nutritionist-card {
            background: linear-gradient(135deg, #ffffff 0%, #f8fafb 100%);
            border: 1px solid rgba(74, 115, 55, 0.1);
            border-radius: 16px;
            padding: 30px;
            text-align: center;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            cursor: pointer;
        }

        .nutritionist-card:hover {
            transform: translateY(-8px);
            box-shadow: 0 20px 50px rgba(74, 115, 55, 0.15);
            border-color: var(--primary);
        }

        .nutritionist-avatar {
            width: 100px;
            height: 100px;
            background: linear-gradient(135deg, var(--primary), var(--primary-light));
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 48px;
            color: white;
            margin: 0 auto 20px;
        }

        .nutritionist-name {
            font-size: 20px;
            font-weight: 700;
            color: #1a1a1a;
            margin: 15px 0 5px;
        }

        .nutritionist-specialty {
            font-size: 14px;
            color: var(--primary);
            font-weight: 600;
            margin-bottom: 15px;
        }

        .nutritionist-info {
            font-size: 14px;
            color: #666;
            line-height: 1.6;
            margin-bottom: 20px;
        }

        .nutritionist-rating {
            font-size: 13px;
            color: #f59e0b;
            margin-bottom: 20px;
        }

        .btn-primary-large {
            padding: 12px 30px;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 50px;
            font-weight: 700;
            font-size: 14px;
            text-decoration: none;
            display: inline-block;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            cursor: pointer;
        }

        .btn-primary-large:hover {
            background: var(--primary-dark);
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(74, 115, 55, 0.3);
        }

        .btn-secondary-large {
            padding: 12px 30px;
            background: transparent;
            color: var(--primary);
            border: 2px solid var(--primary);
            border-radius: 50px;
            font-weight: 700;
            font-size: 14px;
            text-decoration: none;
            display: inline-block;
            transition: all 0.3s;
            cursor: pointer;
        }

        .btn-secondary-large:hover {
            background: var(--primary);
            color: white;
        }

        @media (max-width: 768px) {
            .section-header h2 {
                font-size: 28px;
            }

            .nutritionist-grid {
                grid-template-columns: 1fr;
            }

            .nav-container {
                flex-direction: column;
                gap: 15px;
            }
        }
    </style>
</head>
<body>
    <div class="page-container">
        <!-- Navigation -->
        <nav class="navbar-enhanced">
            <div class="nav-container">
                <a href="HomePage.html" class="logo-modern">
                    <i class="bi bi-heart-pulse-fill"></i> NutriAI
                </a>
                
                    <a href="UserDashboard.html" class="btn-primary-large" style="text-decoration: none;">
                        <i class="bi bi-arrow-left"></i> Back to Dashboard
                    </a>
                </div>
            </div>
        </nav>

        <!-- Nutritionist Selection Section -->
        <section class="nutritionist-section">
            <div class="section-header">
                <h2>Choose Your Nutritionist</h2>
                <p>Select a certified expert who matches your health goals and preferences</p>
            </div>

            <div class="nutritionist-grid">
        

              

                <!-- Nutritionist 6 -->
               <div class="nutritionist-grid" id="nutritionistsList">
  <!-- cards يتحطو هنا -->
</div>
                    
        </section>
    </div>
</body>
<script>
async function loadNutritionists() {
  const res = await fetch("http://localhost:5000/api/nutritionists");
  const data = await res.json();

  const container = document.getElementById("nutritionistsList");
  container.innerHTML = "";

  data.forEach(n => {
    container.innerHTML += `
      <div class="nutritionist-card">
        <div class="nutritionist-avatar">
          <i class="bi bi-person-fill"></i>
        </div>

        <div class="nutritionist-name">${n.fullName}</div>

        <div class="nutritionist-specialty">
          ${n.specialty || "Nutritionist"}
        </div>

        <div class="nutritionist-rating">
          ⭐⭐⭐⭐⭐ (5.0)
        </div>

        <div class="nutritionist-info">
          Certified nutrition expert
        </div>

        <button class="btn-primary-large"
           onclick="goToBooking('${n._id}')">
          Book Consultation
        </button>
      </div>
    `;
  });
}

// تحويل لصفحة الحجز
function goToBooking(nutritionistId) {
  localStorage.setItem("selectedNutritionist", nutritionistId);
   console.log("Saved:", nutritionistId);
  window.location.href = "book.html";
}

loadNutritionists();

</script>

</html>
