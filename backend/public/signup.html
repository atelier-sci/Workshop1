<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - Weight Loss</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" href="/styles/style.css">
</head>
<body class="auth-body">
    
   <!-- Navigation -->
    <nav class="navbar-enhanced">
        <div class="nav-container">
            <a href="/" class="logo-modern">
                <i class="bi bi-heart-pulse-fill"></i> Viora
            </a>
            <ul class="auth-links">
                <li><a href="HomePage.html" class="btn-modern-outline">Back to Home</a></li>
            </ul>
        </div>
    </nav>

    <div class="auth-container">
        <div class="auth-background">
            <div class="blob blob-1"></div>
            <div class="blob blob-2"></div>
            <div class="blob blob-3"></div>
        </div>

        <div class="auth-wrapper">
            <!-- Sign Up Form -->
            <div class="auth-card">
                <div class="auth-header">
                    <h2>Create Your Account</h2>
                    
                </div>

                <form id="registerForm" class="auth-form">
                    <!-- Full Name -->
                    <div class="form-group">
                        <label for="fullName" class="form-label">Full Name</label>
                        <div class="input-wrapper">
                            <i class="bi bi-person"></i>
                            <input 
                                type="text" 
                                class="form-control-modern" 
                                id="fullName" 
                                name="fullName" 
                                placeholder="Your FullName" 
                                required
                            >
                        </div>
                    </div>

                    <!-- Email -->
                    <div class="form-group">
                        <label for="email" class="form-label">Email Address</label>
                        <div class="input-wrapper">
                            <i class="bi bi-envelope"></i>
                            <input 
                                type="email" 
                                class="form-control-modern" 
                                id="email" 
                                name="email" 
                                placeholder="you@example.com" 
                                required
                            >
                        </div>
                    </div>

                    <!-- Password -->
                    <div class="form-group">
                        <label for="password" class="form-label">Password</label>
                        <div class="input-wrapper">
                            <i class="bi bi-lock"></i>
                            <input 
                                type="password" 
                                class="form-control-modern" 
                                id="password" 
                                name="password" 
                                placeholder="••••••••" 
                                required
                                minlength="8"
                            >
                        </div>
                        <small class="form-hint">At least 8 characters</small>
                    </div>

                    <!-- Health Info Grid -->
                    <div class="form-group-grid">
                        <div class="form-group">
                            <label for="weight" class="form-label">Weight (kg)</label>
                            <div class="input-wrapper">
                                <i class="bi bi-heart-pulse"></i>
                                <input 
                                    type="number" 
                                    class="form-control-modern" 
                                    id="weight" 
                                    name="weight" 
                                    placeholder="70" 
                                    min="20" 
                                    max="300" 
                                    step="0.1" 
                                    required
                                >
                            </div>
                        </div>

                        <div class="form-group">
                            <label for="age" class="form-label">Age</label>
                            <div class="input-wrapper">
                                <i class="bi bi-calendar"></i>
                                <input 
                                    type="number" 
                                    class="form-control-modern" 
                                    id="age" 
                                    name="age" 
                                    placeholder="30" 
                                    min="10" 
                                    max="120" 
                                    required
                                >
                            </div>
                        </div>

                        <div class="form-group">
                            <label for="height" class="form-label">Height (cm)</label>
                            <div class="input-wrapper">
                                <i class="bi bi-arrow-up"></i>
                                <input 
                                    type="number" 
                                    class="form-control-modern" 
                                    id="height" 
                                    name="height" 
                                    placeholder="175" 
                                    min="50" 
                                    max="250" 
                                    required
                                >
                            </div>
                        </div>
                    </div>

                    <!-- Terms & Conditions -->
                   

                    <!-- Submit Button -->
                    <button type="submit" class="btn-auth-submit" id="submitBtn">
                        <span id="btnText">Create Account</span>
                        <span id="btnSpinner" class="spinner-border spinner-border-sm d-none ms-2"></span>
                    </button>
                </form>

                <!-- Login Link -->
                <div class="auth-footer">
                    <p class="paragraph">Already have an account?<a href="login.html" class="link-bold">Log in</a></p>
                </div>
            </div>
              <!-- Side Benefits -->
            <div class="auth-benefits">
                <h3>What You'll Get</h3>
                <div class="benefit-item">
                    <div class="benefit-icon"><i class="bi bi-check2-circle"></i></div>
                    <div class="benefit-text">
                        <h4>AI Meal Analyzer</h4>
                        <p>Instant calorie detection</p>
                    </div>
                </div>
                <div class="benefit-item">
                    <div class="benefit-icon"><i class="bi bi-check2-circle"></i></div>
                    <div class="benefit-text">
                        <h4>Expert Guidance</h4>
                        <p>Personal nutrition plan</p>
                    </div>
                </div>
                <div class="benefit-item">
                    <div class="benefit-icon"><i class="bi bi-check2-circle"></i></div>
                    <div class="benefit-text">
                        <h4>Progress Tracking</h4>
                        <p>Monitor your results</p>
                    </div>
                </div>
            </div>
        </div>
            
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
document.getElementById('registerForm').addEventListener('submit', async function (e) {
    e.preventDefault();

    const btnText = document.getElementById('btnText');
    const btnSpinner = document.getElementById('btnSpinner');
    const submitBtn = document.getElementById('submitBtn');

    btnText.classList.add('d-none');
    btnSpinner.classList.remove('d-none');
    submitBtn.disabled = true;

    // إزالة الأخطاء السابقة
    document.querySelectorAll('.error-message').forEach(el => el.remove());

    const formData = {
        fullName: document.getElementById('fullName').value,
        email: document.getElementById('email').value,
        password: document.getElementById('password').value,
        weight: parseFloat(document.getElementById('weight').value),
        age: parseInt(document.getElementById('age').value),
        height: parseInt(document.getElementById('height').value)
    };

    try {
        // إرسال طلب التسجيل
        const registerResponse = await fetch('http://localhost:5000/api/register', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(formData)
        });

        const registerData = await registerResponse.json();

        if (!registerResponse.ok) {
            showError('email', registerData.message || 'Registration failed');
            throw new Error(registerData.message);
        }

        // تسجيل الدخول تلقائيًا
        const loginResponse = await fetch('http://localhost:5000/api/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                email: formData.email,
                password: formData.password
            })
        });

        const loginData = await loginResponse.json();

        if (!loginResponse.ok) {
            throw new Error(loginData.message);
        }

        // حفظ بيانات المستخدم
        localStorage.setItem('user', JSON.stringify(loginData.user));

        // الانتقال إلى الصفحة الرئيسية
        window.location.href = 'HomePage.html';

    } catch (error) {
        console.error('Error:', error);
    } finally {
        btnText.classList.remove('d-none');
        btnSpinner.classList.add('d-none');
        submitBtn.disabled = false;
    }
});

// دالة عرض الخطأ أسفل الحقل
function showError(fieldId, message) {
    const input = document.getElementById(fieldId);
    input.classList.add('is-invalid');

    const error = document.createElement('div');
    error.className = 'invalid-feedback error-message';
    error.textContent = message;

    input.parentElement.appendChild(error);
}

</script>
</body>
</html>
