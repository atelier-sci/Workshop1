<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Article - NutriAI</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" href="/styles/style.css">

    <style>
        body {
            background: #f6f8fb;
        }

        .article-wrapper {
            max-width: 850px;
            margin: 60px auto;
            padding: 30px;
        }

        .article-card {
            background: white;
            border-radius: 18px;
            padding: 35px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.08);
        }

        .article-title {
            font-size: 32px;
            font-weight: bold;
            color: #1e293b;
            margin-bottom: 15px;
        }

        .article-meta {
            color: #64748b;
            font-size: 14px;
            margin-bottom: 25px;
        }

        .article-content {
            font-size: 17px;
            line-height: 1.8;
            color: #334155;
            white-space: pre-line;
        }

        .back-btn {
            text-decoration: none;
            font-weight: 500;
            color: #2563eb;
        }

        .back-btn:hover {
            text-decoration: underline;
        }
    </style>
</head>

<body>

<!-- NAVBAR -->
<nav class="navbar-enhanced">
    <div class="nav-container">
        <a href="HomePage.html" class="logo-modern">
            <i class="bi bi-heart-pulse-fill"></i> Viora
        </a>

        <ul class="auth-links">
            <li>
                <a href="/Blog.html" class="btn-modern-outline">
                     Back to Blog
                </a>
            </li>
        </ul>
    </div>
</nav>

<!-- ARTICLE -->
<div class="article-wrapper">

    <div class="article-card">

        <h1 id="title" class="article-title"></h1>

        <div class="article-meta">
            <i class="bi bi-calendar"></i>
            <span id="date"></span>

            <i class="bi bi-clock ms-3"></i>
            <span id="readTime"></span>
        </div>

        <!-- content فقط (بدون صورة) -->
        <p id="content" class="article-content"></p>

    </div>

</div>

<script>
const id = new URLSearchParams(window.location.search).get("id");

fetch(`http://localhost:5000/api/blogs/${id}`)
.then(res => res.json())
.then(blog => {

    document.getElementById("title").innerText = blog.title;
    document.getElementById("content").innerText = blog.content;

    document.getElementById("date").innerText =
        blog.createdAt
            ? new Date(blog.createdAt).toLocaleDateString()
            : "No date available";

    document.getElementById("readTime").innerText = "5 min read";
});
</script>

</body>
</html>
